name: Windows MiniMapper

on:
  workflow_dispatch:
  push:
    paths:
      - minimapper.py
      - MiniMapper.spec
      - MiniMapper.iss
      - rthook_mido.py
      - requirements-minimapper.txt
      - .github/workflows/windows-build.yml

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          python -m pip install pyinstaller mido python-rtmidi

      - name: PyInstaller
        run: python -m PyInstaller --noconfirm MiniMapper.spec

      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\MiniMapper\* -DestinationPath dist\MiniMapper-windows.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc MiniMapper.iss

      - uses: actions/upload-artifact@v4
        with:
          name: MiniMapper-windows
          path: |
            dist/MiniMapper
            dist/MiniMapper-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MiniMapper-setup
          path: dist/MiniMapperSetup.exe
